<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#1E2A78;font-family:Archivo,sans-serif;color:#fff}
.shelf{padding:18px 12px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;border-bottom:14px solid #C9C2B4}
.box{height:120px;border-radius:4px 4px 0 0;padding:6px;font-family:'Bowlby One';font-size:11px;line-height:1}
.b1{background:#2E8B57}.b2{background:#8E44AD}.b3{background:#F39C12;height:100px}
.hero{margin:18px 22px 0;background:#D7261E;border-radius:6px;padding:18px 16px 16px;position:relative;transform:translateY(-6px);box-shadow:0 18px 0 -6px #0004}
.hero h1{font-family:'Bowlby One';font-size:40px;line-height:.95;color:#FFC423;text-shadow:3px 3px 0 #1E2A78}
.hero p{font-size:14px;margin-top:10px;font-weight:500}
.burst{position:absolute;right:-14px;top:-26px;width:96px;height:96px;background:#FFC423;color:#D7261E;font-family:'Bowlby One';display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;clip-path:polygon(50% 0,61% 18%,82% 10%,80% 32%,100% 40%,84% 56%,96% 76%,74% 78%,68% 100%,50% 86%,32% 100%,26% 78%,4% 76%,16% 56%,0 40%,20% 32%,18% 10%,39% 18%)}
.panel{background:#fff;color:#111;margin-top:14px;padding:10px;font-size:12px;border-radius:4px}
.panel b{font-family:'Bowlby One';font-size:26px;color:#D7261E}
.cta{display:block;margin-top:12px;background:#FFC423;color:#1E2A78;text-align:center;font-family:'Bowlby One';padding:12px;text-decoration:none;border-radius:4px}
.shelf2{margin-top:26px;padding:0 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;border-bottom:14px solid #C9C2B4}
.shelf2 div{height:90px;border-radius:3px 3px 0 0}
</style></head><body>
<div class="shelf"><div class="box b1">ADVOCACIA</div><div class="box b2">PET SHOP</div><div class="box b3">MARMORARIA</div></div>
<div class="hero"><div class="burst">NOVO!<br>1 DIA</div>
<h1>SEU SITE PRONTO EM 1 DIA</h1><p>Do Instagram para uma página que vende. Por Henrique Bueno.</p>
<div class="panel">De <s>R$999,90</s> por <b>R$499,90</b> + domínio grátis</div>
<a class="cta" href="#">PEGAR NO WHATSAPP</a></div>
<div class="shelf2"><div style="background:#16A085"></div><div style="background:#E74C3C;height:70px"></div><div style="background:#3498DB"></div><div style="background:#F1C40F;height:80px"></div></div>
</body></html>
