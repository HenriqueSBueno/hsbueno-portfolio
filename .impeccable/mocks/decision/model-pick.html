<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#FFD400;color:#111;font-family:Archivo,sans-serif}
.top{background:#E30613;color:#fff;font-family:Anton;font-size:56px;line-height:1;text-align:center;padding:14px 10px 10px;letter-spacing:.01em}
.top small{display:block;font-family:Archivo;font-weight:800;font-size:12px;letter-spacing:.2em}
.prod{margin:16px;background:#fff;border:3px solid #111;padding:14px;position:relative}
.prod h2{font-family:Anton;font-size:30px;line-height:1.05}
.prod p{font-size:14px;margin-top:6px}
.shot{height:150px;margin-top:12px;background:repeating-linear-gradient(0deg,#eee 0 10px,#f7f7f7 10px 20px);border:1px solid #111}
.tag{position:absolute;right:-12px;bottom:-34px;width:170px;height:170px;border-radius:50%;background:#E30613;color:#FFD400;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);border:4px solid #FFD400;box-shadow:0 0 0 3px #E30613}
.tag s{color:#fff;font-size:14px;font-weight:800}
.tag b{font-family:Anton;font-size:46px;line-height:1}
.tag small{font-weight:800;font-size:11px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:50px 16px 0}
.row div{background:#fff;border:2px solid #111;height:96px;font-size:10px;font-weight:800;padding:4px;display:flex;align-items:end}
.cta{display:block;margin:18px 16px;background:#111;color:#FFD400;text-align:center;font-family:Anton;font-size:24px;padding:14px;text-decoration:none}
.foot{text-align:center;font-size:11px;font-weight:800}
</style></head><body>
<div class="top"><small>Oferta da semana · Henrique Bueno</small>SEU SITE PRONTO EM 1 DIA</div>
<div class="prod"><h2>Landing page profissional + domínio grátis</h2><p>Do seu Instagram para uma página que vende.</p><div class="shot"></div>
<div class="tag"><s>DE R$999,90</s><small>POR</small><b>499,90</b><small>À VISTA</small></div></div>
<div class="row"><div>Advocacia</div><div>Marmoraria</div><div>Pet shop</div></div>
<a class="cta" href="#">PEDIR NO WHATSAPP</a>
<p class="foot">(19) 99439-5599 · suporte R$49,90/mês</p>
</body></html>
