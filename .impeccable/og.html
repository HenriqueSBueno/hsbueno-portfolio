<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#D11F1A;font-family:Archivo,sans-serif;position:relative;color:#fff}
.flap{position:absolute;inset:0 0 auto 0;height:22px;background:#A8160F;border-bottom:4px solid #0D2B6A}
.edge{position:absolute;inset:auto 0 0 0;height:96px;background:#0D2B6A;display:flex;align-items:center;gap:22px;padding:0 64px}
.edge img{width:64px;height:64px;border-radius:50%;border:3px solid #FFD400;object-fit:cover}
.edge b{font-family:"Lilita One";font-size:34px;font-weight:400;color:#fff}
.edge span{font-weight:700;font-stretch:85%;font-size:24px;color:#C9D4EA}
.edge i{font-style:normal;margin-left:auto;background:#1B7A34;border:3px solid #fff;border-radius:40px;padding:8px 20px;font-weight:800;font-stretch:90%;font-size:24px}
h1{position:absolute;left:64px;top:70px;width:700px;font-family:"Lilita One";font-weight:400;font-size:112px;line-height:.93;letter-spacing:-.01em;
 -webkit-text-stroke:10px #0D2B6A;paint-order:stroke fill;text-shadow:0 8px 0 #0D2B6A}
h1 em{font-style:normal;color:#FFD400}
.sub{position:absolute;left:64px;top:408px;width:600px;line-height:1.35;font-weight:700;font-stretch:90%;font-size:30px;color:#fff}
.sub u{text-decoration-color:#FFD400;text-decoration-thickness:4px;text-underline-offset:6px}
.burst{position:absolute;right:50px;top:36px;width:430px;height:430px}
.burst svg{width:100%;height:100%;transform:rotate(-8deg)}
.p{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0D2B6A;transform:rotate(-8deg)}
.p s{font-weight:800;font-size:28px;text-decoration-color:#D11F1A;text-decoration-thickness:4px}
.p small{font-weight:800;font-stretch:80%;font-size:22px;text-transform:uppercase;letter-spacing:.06em}
.p b{font-family:"Lilita One";font-weight:400;font-size:76px;line-height:1;margin:2px 0}
</style></head><body>
<div class="flap"></div>
<h1>Seu site<br>pronto em<br><em>1 dia</em></h1>
<p class="sub">Do Instagram pra uma página que <u>leva cliente pro WhatsApp</u></p>
<div class="burst">
 <svg viewBox="0 0 200 200"><polygon fill="#FFD400" stroke="#0D2B6A" stroke-width="5" stroke-linejoin="round" points="100,4 117,36 150,14 152,52 190,48 172,82 198,104 164,122 182,156 144,156 140,194 110,170 86,198 76,160 40,176 46,138 8,128 36,102 10,74 48,66 40,28 76,40"/></svg>
 <div class="p"><s>R$ 999,90</s><small>por</small><b>499,90</b><small>+ domínio</small><small>grátis</small></div>
</div>
<div class="edge"><img src="../img/henrique.jpg" alt=""><b>Henrique Bueno</b><span>Landing pages em até 24h</span><i>(19) 99439-5599</i></div>
</body></html>
